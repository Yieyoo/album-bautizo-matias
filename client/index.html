<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cfdeea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La foto de la portada se pide primero, antes que el resto -->
    <link rel="preload" as="image" href="%BASE_URL%matias/matias-01-sm.jpg" fetchpriority="high" />
    <!-- Las tipografías se cargan sin frenar la página: con mala señal se ve
         primero con letras del sistema y cambian a las elegantes al llegar -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta
      name="description"
      content="Álbum digital del bautizo de Matías. Comparte y disfruta los recuerdos de este día especial."
    />
    <title>Álbum del bautizo de Matías</title>
  </head>
  <body>
    <!-- Se ve mientras arranca la página (y queda si un navegador no la puede abrir),
         en lugar de una pantalla en blanco. La página lo reemplaza al cargar. -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: #fffdfa; color: #4f6a82; font-family: Georgia, serif; text-align: center;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.3em; color: #917d6c;">MI BAUTIZO</p>
        <p style="margin: 0; font-size: 44px; letter-spacing: 0.05em;">MATÍAS</p>
        <p id="boot-message" style="margin: 8px 0 0; font-size: 16px; font-style: italic; color: #7d8f9f;">Cargando el álbum…</p>
      </div>
    </div>
    <script>
      // Si algo falla antes de que arranque la página, se muestra el motivo en
      // pantalla para que el invitado pueda mandar captura
      window.addEventListener(
        'error',
        function (event) {
          var message = document.getElementById('boot-message')
          if (!message) return
          var target = event.target
          // También atrapa archivos que no descargaron (por ejemplo el código de la página)
          var detail = event.message || (target && (target.src || target.href)) || 'error'
          message.textContent = 'No se pudo abrir el álbum en este navegador (' + detail + ').'
        },
        true
      )
      // Si a los 12 s la página no arrancó, se explica qué hacer en vez de seguir esperando
      setTimeout(function () {
        var message = document.getElementById('boot-message')
        if (message) {
          message.innerHTML =
            'Está tardando más de lo normal.<br />Revisa tu señal o abre <b>bautizomatias2026.com</b> en Safari o Chrome.'
        }
      }, 12000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
